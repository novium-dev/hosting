# Reproduces the routing the backend used to do itself: one origin, `/api/*`
# goes to the backend, everything else to the SPA.
#
#   cp .env.example .env   # fill in DOMAIN, ACME_EMAIL, image tags, secrets
#   docker compose up -d
#
# The backend is configured entirely from the environment; see
# ../backend/.env.example for every variable it reads.
services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=novium
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --accesslog=true
      - --log.level=INFO
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acme:/acme
    networks:
      - novium

  backend:
    image: ${IMAGE_BACKEND:-novium/backend:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    environment:
      BACKEND_DATA_DIR: /data
      BACKEND_LISTENERS: "[::]:8080"
      BACKEND_PUBLIC_URL: https://${DOMAIN}
      BACKEND_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB:-backend}
      BACKEND_CACHE_URL: valkey://valkey?protocol=resp3
      BACKEND_AUTH_PROVIDER: ${AUTH_PROVIDER:-user}
      BACKEND_AUTH_AUTHORIZE_URL: ${AUTH_AUTHORIZE_URL}
      BACKEND_AUTH_TOKEN_URL: ${AUTH_TOKEN_URL}
      BACKEND_AUTH_REDIRECT_URL: https://${DOMAIN}/api/auth/callback
      BACKEND_AUTH_USERINFO_URL: ${AUTH_USERINFO_URL}
      BACKEND_AUTH_CLIENT_ID: ${AUTH_CLIENT_ID}
      BACKEND_AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET}
      BACKEND_CURSEFORGE_API_KEY: ${CURSEFORGE_API_KEY:-}
      BACKEND_CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      BACKEND_PANGOLIN_API_URL: ${PANGOLIN_API_URL:-}
      BACKEND_PANGOLIN_API_KEY: ${PANGOLIN_API_KEY:-}
      BACKEND_PANGOLIN_ORG_ID: ${PANGOLIN_ORG_ID:-}
      BACKEND_PANGOLIN_SITE_ID: ${PANGOLIN_SITE_ID:-}
    volumes:
      - backend_data:/data
    labels:
      - traefik.enable=true
      # Higher priority than the SPA router so /api/* wins on the same host.
      # `/api/` + exact `/api` rather than PathPrefix(`/api`), which would also
      # swallow paths like /apifoo that belong to the SPA.
      - traefik.http.routers.backend.rule=Host(`${DOMAIN}`) && (PathPrefix(`/api/`) || Path(`/api`))
      - traefik.http.routers.backend.priority=100
      - traefik.http.routers.backend.entrypoints=websecure
      - traefik.http.services.backend.loadbalancer.server.port=8080
      - traefik.http.services.backend.loadbalancer.healthcheck.path=/api/health
      - traefik.http.services.backend.loadbalancer.healthcheck.interval=10s
    networks:
      - novium

  frontend:
    image: ${IMAGE_FRONTEND:-novium/frontend:latest}
    restart: unless-stopped
    # Read at container start and written into /runtime-config.js, so changing
    # any of these is a restart rather than an image rebuild.
    environment:
      VITE_APP_NAME: ${APP_NAME:-}
      VITE_LOGO_URL: ${LOGO_URL:-}
      VITE_TERMS_URL: ${TERMS_URL:-}
      VITE_PRIVACY_URL: ${PRIVACY_URL:-}
      VITE_IMPRINT_URL: ${IMPRINT_URL:-}
      VITE_BEHIND_CLOUDFLARE: ${BEHIND_CLOUDFLARE:-false}
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.frontend.priority=1
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.services.frontend.loadbalancer.server.port=8080
    networks:
      - novium

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-backend}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-backend}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - novium

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: valkey-server --save 60 1 --loglevel warning
    volumes:
      - valkey_data:/data
    networks:
      - novium

volumes:
  acme:
  backend_data:
  postgres_data:
  valkey_data:

networks:
  novium:
    name: novium

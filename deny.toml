[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl"
]
all-features = true

[bans]
# We want to keep the dependency tree as slim as possible. Let's
# warn when we're shipping multiple versions of the same crate.
multiple-versions = "warn"

deny = [
  # We want rustls
  { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

allow-git = [
  "https://github.com/novium-dev/daemon.git",
  "https://github.com/novium-dev/zelus_keys.git",
  "https://github.com/0xIO32/zelus.git",
  "https://github.com/0xIO32/reqwest.git",
  "https://github.com/idubrov/json-patch.git?rev=2523b73cbf419ffd69e79c88fb4fe584e80fe53d",
  "https://github.com/acatton/serde-yaml-ng?rev=3628102977f3ec9e02b95ef32fcec30b3df91390",
]

[licenses]
unused-allowed-license = "deny"
allow = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
  "ISC",
  "CC0-1.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "Zlib",
  "AGPL-3.0-only",
  "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[advisories]
unmaintained = "workspace"
ignore = [
  { id = "RUSTSEC-2026-0459", reason = "likely not affected, awaiting bump https://github.com/transact-rs/sqlx/issues/4516" }
]

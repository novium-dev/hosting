services:
  mariadb:
    image: mariadb:latest
    container_name: backend_mariadb
    network_mode: bridge
    ports:
      - 3306:3306
    environment:
      - MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=1
    volumes:
      - ../mariadb/sockets:/var/run/mysqld
      - ../mariadb/data:/var/lib/mysql
  postgres:
    image: postgres:18-alpine
    container_name: backend_postgres
    network_mode: bridge
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: backend
    volumes:
      - ../postgres:/var/lib/postgresql
  valkey:
    image: valkey/valkey
    container_name: backend_valkey
    network_mode: bridge
    ports:
      - 6379:6379
    command: valkey-server /valkey.conf --save 60 1 --loglevel warning
    volumes:
      - ../valkey/data:/data
      - ../valkey/sockets:/var/run/valkey
      - ../valkey/valkey.conf:/valkey.conf:ro

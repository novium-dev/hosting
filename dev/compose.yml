services:
  postgres:
    image: postgres:16-alpine
    container_name: backend_postgres
    network_mode: bridge
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=backend
    volumes:
      - ../postgres/data:/var/lib/postgresql/data
  valkey:
    image: valkey/valkey
    container_name: backend_valkey
    network_mode: bridge
    ports:
      - 6379:6379
    command: valkey-server /valkey.conf --save 60 1 --loglevel warning
    volumes:
      - ../valkey/data:/data
      - ../valkey/sockets:/var/run/valkey
      - ../valkey/valkey.conf:/valkey.conf:ro

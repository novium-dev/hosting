[package]
name = "database_agent_common"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[features]
default = ["service"]
service = [
    "dep:zelus",
    "dep:utoipa-axum",
    "dep:sha2",
    "dep:bytes",
]
sdk = [
    "service",
    "dep:zelus_keys",
    "dep:reqwest",
    "dep:rustls",
    "dep:either",
    "dep:http",
]

[dependencies]
arrayvec.workspace = true
serde.workspace = true
url = { workspace = true, features = ["serde"] }
serde_json.workspace = true
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "serde"] }
utoipa.workspace = true

[dependencies.zelus]
workspace = true
features = ["error", "io"]
optional = true

[dependencies.zelus_keys]
workspace = true
optional = true

[dependencies.reqwest]
version = "0.13"
default-features = false
features = ["charset", "http2", "json", "rustls", "stream", "zstd"]
optional = true

[dependencies.rustls]
workspace = true
optional = true

[dependencies.either]
version = "1.18.0"
optional = true

[dependencies.http]
workspace = true
optional = true

[dependencies.utoipa-axum]
workspace = true
optional = true

[dependencies.sha2]
workspace = true
optional = true

[dependencies.bytes]
workspace = true
optional = true

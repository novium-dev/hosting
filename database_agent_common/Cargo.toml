[package]
name = "database_agent_common"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[features]
default = ["service"]
service = [
    "dep:zelus",
    "dep:axum",
    "dep:tokio",
    "dep:tokio-util",
    "dep:bytes",
    "dep:futures-util",
]
sdk = [
    "service",
    "dep:daemon_common",
    "dep:reqwest",
    "dep:rustls",
    "dep:either",
    "dep:http",
]

[dependencies]
arrayvec.workspace = true
serde.workspace = true
url.workspace = true
serde_json.workspace = true
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "serde"] }
utoipa.workspace = true

[dependencies.zelus]
workspace = true
features = ["error", "io"]
optional = true

[dependencies.daemon_common]
workspace = true
features = ["keys"]
optional = true

[dependencies.reqwest]
version = "0.13"
default-features = false
features = ["charset", "http2", "json", "rustls", "stream", "zstd"]
optional = true

[dependencies.rustls]
workspace = true
optional = true

[dependencies.either]
version = "1.18.0"
optional = true

[dependencies.http]
workspace = true
optional = true

[dependencies.axum]
workspace = true
optional = true

[dependencies.tokio]
workspace = true
optional = true

[dependencies.tokio-util]
workspace = true
optional = true

[dependencies.bytes]
workspace = true
optional = true

[dependencies.futures-util]
workspace = true
optional = true

[package]
name = "hosting-system"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.47.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
thiserror = "2.0.16"
futures = "0.3.31"
ed25519-dalek = "2.2.0"
rustls = "0.23.31"
indexmap = "2.11.0"
regex = "1.11.2"
async-trait = "0.1.89"
bytes = "1.10.1"
either = "1.15.0"

axum = "0.8.4"
axum-extra = "0.10.1"
axum-server = "0.7.2"
axum-login = "0.18.0"
reqwest = "0.12.23"

uuid = "1.18.1"

serde = "1.0"
serde_json = "1.0"
nanoid = "0.4.0"

sqlx = { version = "0.8", features = [ "mysql", "runtime-tokio", "tls-native-tls" ] }
bitflags = "2.9.4"
arrayvec = "0.7.6"
concat-idents = "1.1.5"

[dependencies.daemon_common]
git = "ssh://git@github.com/novium-dev/daemon.git"
default-features = false
features = ["sdk", "backend"]


[dependencies.sentry]
version = "0.42.0"
default-features = false
features = [
    "backtrace",
    "contexts",
    "debug-images",
    "panic",
    "reqwest",
    "rustls",
    "log",
    "tower",
    "tower-axum-matched-path",
    "tracing",
]

[dependencies.utoipa]
version = "5.4.0"
features = ["macros", "preserve_path_order"]

[dependencies.redis]
version = "0.31.0"
default-features = false
features = [
    "uuid",
    "json",
    "tls-rustls",
    "tls-rustls-webpki-roots",
    "tokio-rustls-comp",
    "connection-manager",
]

[dependencies.speedy]
version = "0.8.7"
features = ["speedy-derive", "indexmap_v2"]
name: CI

on:
  push:
    branches:
      - dev
      - prod
  pull_request:

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUST_IMAGE: rust:1.94.1-alpine
  BACKEND_DATABASE_URL: postgres://postgres:postgres@127.0.0.1/backend
  POSTGRES_PASSWORD: postgres

jobs:
  cli_shared:
    name: Prepare shared CLI tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore SQLx CLI cache
        uses: actions/cache@v4
        with:
          path: crates/sqlx-cli
          key: rust-cache-cli-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-cache-cli-${{ runner.os }}-

      - name: Install SQLx CLI
        run: |
          set -eu
          docker run --rm \
            --network host \
            -e CARGO_TERM_COLOR \
            -v "$PWD:/work" \
            -w /work \
            "$RUST_IMAGE" \
            sh -euxc '
              rustc --version && cargo --version
              apk add --no-cache git musl-dev openssh-client-default --repository=https://dl-cdn.alpinelinux.org/alpine/edge/main
              mkdir -p crates/sqlx-cli
              cargo install --color always --verbose --no-default-features --features postgres,rustls sqlx-cli --root crates/sqlx-cli
            '

      - name: Upload SQLx CLI
        uses: actions/upload-artifact@v4
        with:
          name: sqlx-cli
          path: crates/sqlx-cli/bin
          retention-days: 7

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: |
          set -eu
          docker run --rm \
            -e CARGO_TERM_COLOR \
            -v "$PWD:/work" \
            -w /work \
            "$RUST_IMAGE" \
            sh -euxc '
              rustc --version && cargo --version
              apk add --no-cache git musl-dev --repository=https://dl-cdn.alpinelinux.org/alpine/edge/main
              rustup component add rustfmt
              cargo fmt --check --all --verbose
            '

  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore cargo-deny cache
        uses: actions/cache@v4
        with:
          path: crates/cargo-deny
          key: rust-cache-cargo-deny-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-cache-cargo-deny-${{ runner.os }}-

      - name: Configure SSH
        env:
          DAEMON_SSH_KEY: ${{ secrets.DAEMON_SSH_KEY }}
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan github.com >> "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)"
          echo "$DAEMON_SSH_KEY" | tr -d '\r' | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"

      - name: Run cargo-deny
        run: |
          set -eu
          docker run --rm \
            --network host \
            -e CARGO_TERM_COLOR \
            -e SSH_AUTH_SOCK=/ssh-agent \
            -v "$SSH_AUTH_SOCK:/ssh-agent" \
            -v "$HOME/.ssh:/root/.ssh:ro" \
            -v "$PWD:/work" \
            -w /work \
            "$RUST_IMAGE" \
            sh -euxc '
              rustc --version && cargo --version
              apk add --no-cache git musl-dev openssh-client-default --repository=https://dl-cdn.alpinelinux.org/alpine/edge/main
              mkdir -p crates/cargo-deny
              cargo install --color always --verbose cargo-deny --root crates/cargo-deny
              crates/cargo-deny/bin/cargo-deny check
            '

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: cli_shared
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Restore cargo cache
        uses: actions/cache@v4
        with:
          path: |
            .cargo_home
            target
          key: rust-cache-clippy-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-cache-clippy-${{ runner.os }}-${{ github.event.repository.default_branch }}-
            rust-cache-clippy-${{ runner.os }}-

      - name: Download SQLx CLI
        uses: actions/download-artifact@v4
        with:
          name: sqlx-cli
          path: crates/sqlx-cli/bin

      - name: Configure SSH
        env:
          DAEMON_SSH_KEY: ${{ secrets.DAEMON_SSH_KEY }}
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan github.com >> "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)"
          echo "$DAEMON_SSH_KEY" | tr -d '\r' | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"

      - name: Run clippy
        run: |
          set -eu
          chmod +x crates/sqlx-cli/bin/sqlx
          docker run --rm \
            --network host \
            -e BACKEND_DATABASE_URL \
            -e CARGO_HOME=/work/.cargo_home \
            -e CARGO_TERM_COLOR \
            -e RUSTFLAGS="-C opt-level=0 -C linker=clang-21 -C link-arg=-fuse-ld=lld" \
            -e SSH_AUTH_SOCK=/ssh-agent \
            -v "$SSH_AUTH_SOCK:/ssh-agent" \
            -v "$HOME/.ssh:/root/.ssh:ro" \
            -v "$PWD:/work" \
            -w /work \
            "$RUST_IMAGE" \
            sh -euxc '
              rustc --version && cargo --version
              mkdir -p .cargo_home
              apk add --no-cache openssh-client-default libxml2-utils musl-dev ncurses-dev ncurses-static zlib-dev zlib-static zstd-dev zstd-static llvm21-static llvm21-dev clang21 clang21-static lld21 git postgresql18-client curl btrfs-progs-dev --repository=https://dl-cdn.alpinelinux.org/alpine/edge/main
              apk upgrade --no-cache gcc --repository=https://dl-cdn.alpinelinux.org/alpine/edge/main
              until pg_isready --host 127.0.0.1 --username postgres --dbname postgres; do sleep 1; done
              crates/sqlx-cli/bin/sqlx database create --database-url "$BACKEND_DATABASE_URL"
              crates/sqlx-cli/bin/sqlx migrate run --database-url "$BACKEND_DATABASE_URL" --source migrations
              rustup component add clippy
              cargo clippy --color always --verbose --no-deps
            '

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: cli_shared
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Restore cargo cache
        uses: actions/cache@v4
        with:
          path: |
            .cargo_home
            target
            crates/cargo2junit
          key: rust-cache-test-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-cache-test-${{ runner.os }}-${{ github.event.repository.default_branch }}-
            rust-cache-test-${{ runner.os }}-

      - name: Download SQLx CLI
        uses: actions/download-artifact@v4
        with:
          name: sqlx-cli
          path: crates/sqlx-cli/bin

      - name: Configure SSH
        env:
          DAEMON_SSH_KEY: ${{ secrets.DAEMON_SSH_KEY }}
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan github.com >> "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)"
          echo "$DAEMON_SSH_KEY" | tr -d '\r' | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          set -eu
          chmod +x crates/sqlx-cli/bin/sqlx
          docker run --rm \
            --network host \
            -e BACKEND_DATABASE_URL \
            -e CARGO_HOME=/work/.cargo_home \
            -e CARGO_TERM_COLOR \
            -e RUSTFLAGS="-C opt-level=0 -C linker=clang-21 -C link-arg=-fuse-ld=lld" \
            -e LLVM_PROFILE_FILE=coverage.profraw \
            -e RUSTC_BOOTSTRAP=1 \
            -e SSH_AUTH_SOCK=/ssh-agent \
            -v "$SSH_AUTH_SOCK:/ssh-agent" \
            -v "$HOME/.ssh:/root/.ssh:ro" \
            -v "$PWD:/work" \
            -w /work \
            "$RUST_IMAGE" \
            sh -euxc '
              rustc --version && cargo --version
              mkdir -p .cargo_home
              apk add --no-cache openssh-client-default libxml2-utils musl-dev ncurses-dev ncurses-static zlib-dev zlib-static zstd-dev zstd-static llvm21-static llvm21-dev clang21 clang21-static lld21 git postgresql18-client curl btrfs-progs-dev --repository=https://dl-cdn.alpinelinux.org/alpine/edge/main
              apk upgrade --no-cache gcc --repository=https://dl-cdn.alpinelinux.org/alpine/edge/main
              until pg_isready --host 127.0.0.1 --username postgres --dbname postgres; do sleep 1; done
              crates/sqlx-cli/bin/sqlx database create --database-url "$BACKEND_DATABASE_URL"
              crates/sqlx-cli/bin/sqlx migrate run --database-url "$BACKEND_DATABASE_URL" --source migrations
              mkdir -p crates/cargo2junit
              cargo install --color always --verbose cargo2junit --root crates/cargo2junit
              curl -L https://github.com/mozilla/grcov/releases/latest/download/grcov-x86_64-unknown-linux-musl.tar.bz2 | tar jxf -
              RUSTFLAGS="$RUSTFLAGS -C instrument-coverage" cargo test --color always --verbose --target x86_64-unknown-linux-musl -- -Zunstable-options --format json --report-time | crates/cargo2junit/bin/cargo2junit > report.xml
              ./grcov . --llvm-path /usr/lib/llvm21/bin/ --binary-path ./target/debug/ -s . -t cobertura --branch --ignore-not-existing --ignore "*cargo*" -o coverage.xml
              xmllint --xpath "concat(\"Coverage - \", 100 * string(//coverage/@line-rate), \"%\")" coverage.xml
            '

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            report.xml
            coverage.xml
          retention-days: 7

  deploy_backend:
    name: Deploy backend image
    runs-on: ubuntu-latest
    needs:
      - clippy
      - deny
      - fmt
      - test
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DAEMON_SSH_KEY: ${{ secrets.DAEMON_SSH_KEY }}
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan github.com >> "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)"
          echo "$DAEMON_SSH_KEY" | tr -d '\r' | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push backend image
        run: |
          set -eu
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-8)"
          docker pull "$IMAGE_NAME:backend-latest" || true
          DOCKER_BUILDKIT=1 docker build \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --cache-from "$IMAGE_NAME:backend-latest" \
            --tag "$IMAGE_NAME:backend-$SHORT_SHA" \
            --tag "$IMAGE_NAME:backend-latest" \
            --ssh default="$SSH_AUTH_SOCK" \
            .
          docker push "$IMAGE_NAME:backend-$SHORT_SHA"
          docker push "$IMAGE_NAME:backend-latest"

stages:
  - prepare
  - check
  - deploy

.rust-default:
  image:
    name: rust:1.98.0-alpine
    pull_policy: if-not-present
  parallel:
  interruptible: true
  variables:
    CARGO_TERM_COLOR: "always"
    CARGO_INCREMENTAL: "0"
    RUSTFLAGS: "-C opt-level=0"

    FF_USE_FASTZIP: "true"
    ARTIFACT_COMPRESSION_LEVEL: "fastest"
    CACHE_COMPRESSION_LEVEL: "fastest"
    FF_SCRIPT_SECTIONS: "true"
  before_script:
    - rustc --version && cargo --version
    - apk add --no-cache git musl-dev --repository=https://dl-cdn.alpinelinux.org/alpine/edge/main

.rust-build-default:
  image:
    name: rust:1.98.0-alpine
    pull_policy: if-not-present
  parallel:
  interruptible: true
  variables:
    BACKEND_DATABASE_URL: 'postgres://postgres:postgres@db/backend'
    POSTGRES_PASSWORD: 'postgres'

    CARGO_HOME: "$CI_PROJECT_DIR/.cargo_home"
    CARGO_TERM_COLOR: "always"
    CARGO_INCREMENTAL: "0"
    CARGO_PROFILE_TEST_DEBUG: "0"
    RUSTFLAGS: "-C opt-level=0 -C linker=clang-22 -C link-arg=-fuse-ld=lld"

    FF_USE_FASTZIP: "true"
    ARTIFACT_COMPRESSION_LEVEL: "fastest"
    CACHE_COMPRESSION_LEVEL: "fastest"
    FF_SCRIPT_SECTIONS: "true"
  before_script:
    - rustc --version && cargo --version
    - mkdir .cargo_home -p
    - echo '#!/bin/ash' > /tmp/llvm-config-static.sh && echo 'if [[ "$1" == "--libs" ]]; then echo "$(/usr/bin/llvm-config-22 "$@" "--link-static")" "-lzstd"; else /usr/bin/llvm-config-22 "$@"; fi' >> /tmp/llvm-config-static.sh && chmod +x /tmp/llvm-config-static.sh
    - apk add --no-cache openssh-client-default libxml2-utils musl-dev ncurses-dev ncurses-static zlib-dev zlib-static zstd-dev zstd-static llvm22-static llvm22-dev clang22 clang22-static lld22 git postgresql18-client sqlite curl --repository=https://dl-cdn.alpinelinux.org/alpine/edge/main
    - until pg_isready --host db --username postgres --dbname postgres; do sleep 1; done
    - crates/sqlx-cli/bin/sqlx database create --database-url "$BACKEND_DATABASE_URL"
    - crates/sqlx-cli/bin/sqlx migrate run --database-url "$BACKEND_DATABASE_URL" --source "backend/migrations"
    # database_agent's query macros are checked against a sqlite schema database
    - ./scripts/dev/database_agent_db.sh
    - eval $(ssh-agent -s)
    - echo "$DAEMON_SSH_KEY" | tr -d '\r' | ssh-add -
  services:
    - name: postgres:18-alpine
      alias: db
      pull_policy: always

.docker-deploy-default:
  stage: deploy
  image:
    name: docker:latest
    pull_policy: always
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
  parallel:
  needs: ["clippy", "deny", "test", "fmt", "frontend"]
  dependencies: []
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  rules:
    # Automatically deploy protected prod
    - if: $CI_COMMIT_BRANCH == "prod" && $CI_COMMIT_REF_PROTECTED == "true"
      when: on_success

    # Allow manual deployment from dev
    - if: $CI_COMMIT_BRANCH == "dev"
      when: manual

    # Disable everywhere else
    - when: never


cli_shared:
  extends: .rust-default
  stage: prepare
  cache:
    - key: rust-cache-cli
      paths:
        - crates/sqlx-cli
      policy: pull-push
  artifacts:
    paths:
      - crates/sqlx-cli/bin
    expire_in: 1 week
  script:
    - mkdir crates/sqlx-cli -p
    - cargo install --color always --verbose --no-default-features --features postgres,rustls sqlx-cli --root crates/sqlx-cli
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED != "true"
      when: never
    - when: on_success

clippy:
  extends: .rust-build-default
  stage: check
  needs: ["cli_shared"]
  cache:
    - key: rust-cache-clippy-$CI_COMMIT_REF_SLUG
      fallback_keys:
        - rust-cache-clippy-$CI_DEFAULT_BRANCH
        - rust-cache-clippy-default
      paths:
        - .cargo_home/
        - target/
      policy: pull-push
  script:
    - rustup component add clippy
    - cargo clippy --color always --verbose --no-deps
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED != "true"
      when: never
    - when: on_success

fmt:
  extends: .rust-default
  stage: check
  needs: []
  script:
    - rustup component add rustfmt
    - cargo fmt --check --all --verbose
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED != "true"
      when: never
    - when: on_success

# Validates the client-only frontend builds (Vite SPA). The build output is
# baked into the all-in-one image by the `deploy` job's Docker build.
frontend:
  stage: check
  image:
    name: oven/bun:1
    pull_policy: if-not-present
  needs: []
  variables:
    BUN_INSTALL_CACHE_DIR: frontend/.bun-cache
  cache:
    key:
      files:
        - frontend/bun.lock
    paths:
      - frontend/.bun-cache/
      - frontend/node_modules/
  before_script:
    - cd frontend && bun install --frozen-lockfile
  script:
    - bun run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED != "true"
      when: never
    - when: on_success

deny:
  extends: .rust-default
  stage: check
  needs: []
  when: manual
  cache:
    - key: rust-cache-cargo-deny-default
      paths:
        - crates/cargo-deny
      policy: pull-push
  script:
    - apk add --no-cache openssh-client-default --repository=https://dl-cdn.alpinelinux.org/alpine/edge/main
    - eval $(ssh-agent -s)
    - echo "$DAEMON_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir crates/cargo-deny -p
    - cargo install --color always --verbose cargo-deny --root crates/cargo-deny
    - crates/cargo-deny/bin/cargo-deny check
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED != "true"
      when: never
    - when: on_success

test:
  extends: .rust-build-default
  stage: check
  when: manual
  cache:
    - key: rust-cache-test-$CI_COMMIT_REF_SLUG
      fallback_keys:
        - rust-cache-test-$CI_DEFAULT_BRANCH
        - rust-cache-test-default
      paths:
        - .cargo_home/
        - target/
      policy: pull-push
    - key: rust-cargo2junit-default
      paths:
        - crates/cargo2junit
      policy: pull-push
  needs: ["cli_shared"]
  script:
    - mkdir crates/cargo2junit -p
    - cargo install --color always --verbose cargo2junit --root crates/cargo2junit
    - curl -L https://github.com/mozilla/grcov/releases/latest/download/grcov-x86_64-unknown-linux-musl.tar.bz2 | tar jxf -
    - RUSTC_BOOTSTRAP=1 RUSTFLAGS="$RUSTFLAGS -C instrument-coverage" LLVM_PROFILE_FILE="coverage.profraw" cargo test --color always --verbose --locked --target x86_64-unknown-linux-musl -- -Zunstable-options --format json --report-time | crates/cargo2junit/bin/cargo2junit > report.xml
    - ./grcov . --llvm-path /usr/lib/llvm21/bin/ --binary-path ./target/debug/ -s . -t cobertura --branch --ignore-not-existing --ignore "*cargo*" -o coverage.xml
    - xmllint --xpath "concat('Coverage - ', 100 * string(//coverage/@line-rate), '%')" coverage.xml
  coverage: '/Coverage - \d+(?:\.\d+)?/'
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED != "true"
      when: never
    - when: on_success
  artifacts:
    when: always
    reports:
      junit:
        - report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week

# Builds the single all-in-one image (backend binary + built frontend SPA,
# served same-origin by the backend) and publishes it as `:latest`.
deploy:
  extends: .docker-deploy-default
  script:
    - apk add --no-cache openssh-client-default --repository=https://dl-cdn.alpinelinux.org/alpine/edge/main
    - eval $(ssh-agent -s)
    - echo "$DAEMON_SSH_KEY" | tr -d '\r' | ssh-add -
    - docker pull $CI_REGISTRY_IMAGE:latest || true
    - docker build --build-arg BUILDKIT_INLINE_CACHE=1 --cache-from $CI_REGISTRY_IMAGE:latest --tag $CI_REGISTRY_IMAGE:${CI_COMMIT_SHA:0:8} --tag $CI_REGISTRY_IMAGE:latest --ssh default .
    - docker push $CI_REGISTRY_IMAGE:${CI_COMMIT_SHA:0:8}
    - docker push $CI_REGISTRY_IMAGE:latest

# Builds the database agent image. It runs on its own hosts (a database host
# registered in the admin UI), so it ships as a separate image from the
# all-in-one backend one above.
deploy_database_agent:
  extends: .docker-deploy-default
  variables:
    IMAGE: "$CI_REGISTRY_IMAGE/database-agent"
  script:
    - apk add --no-cache openssh-client-default --repository=https://dl-cdn.alpinelinux.org/alpine/edge/main
    - eval $(ssh-agent -s)
    - echo "$DAEMON_SSH_KEY" | tr -d '\r' | ssh-add -
    - docker pull $IMAGE:latest || true
    - docker build --build-arg BUILDKIT_INLINE_CACHE=1 --cache-from $IMAGE:latest --tag $IMAGE:${CI_COMMIT_SHA:0:8} --tag $IMAGE:latest --ssh default --file database_agent.Dockerfile .
    - docker push $IMAGE:${CI_COMMIT_SHA:0:8}
    - docker push $IMAGE:latest
